{% extends "base.html" %}

{% block titulo %}Entrar — Imóveis Aqui{% endblock %}

{% block conteudo %}
<div class="cartao cartao-estreito">
    <h1>Entrar</h1>

    {% if form.non_field_errors %}
        <ul class="errorlist">
            {% for erro in form.non_field_errors %}
                <li>{{ erro }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
